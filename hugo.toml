baseURL = "https://starstartlliu-design.github.io/myblog/"
languageCode = "en-us"
title = "Lu's Blog"
theme = "hugo-coder"

[pagination]
pagerSize = 10

[params]
author = "Lu"
description = "Lu's course blog"
info = ["M2 VAR Student at Télécom SudParis"]
colorScheme = "auto"
hideColorSchemeToggle = false
customCSS = ["css/homework.css"]

[[menu.main]]
name = "Posts"
weight = 1
url = "posts/"

[[menu.main]]
name = "HCI"
weight = 2
url = "courses/hci/" 
[markup] 
  [markup.goldmark] 
    [markup.goldmark.renderer] 
      unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]
