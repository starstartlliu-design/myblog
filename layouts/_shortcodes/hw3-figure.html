<figure style="margin:2rem 0;">
  <a href="{{ .Get "src" | relURL }}"><img src="{{ .Get "src" | relURL }}" alt="{{ .Get "caption" }}" loading="lazy" style="display:block;width:100%;height:auto;"></a>
  <figcaption style="font-size:.9em;line-height:1.6;margin-top:.8rem;">{{ .Get "caption" }}</figcaption>
</figure>
